included:
  - ios/Fieldworksdiary
  - ios/FieldworksdiaryTests

excluded:
  - ios/Fieldworksdiary.xcodeproj
  - ios/.build
  - ios/DerivedData

# Opt-in-Rules über die Defaults hinaus. Accessibility-Rules sind hier
# der Hauptpunkt — SwiftLint kann nicht alles erzwingen, aber das
# fehlende `accessibilityLabel` auf Image-Views und das fehlende
# `.accessibilityAddTraits(.isButton)` auf Tap-Gesten ist erfasst.
opt_in_rules:
  # Accessibility
  - accessibility_label_for_image
  - accessibility_trait_for_button

  # UX / Code-Hygiene
  - anonymous_argument_in_multiline_closure
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# `swiftlint analyze` braucht den Swift-Compiler (Xcode) und liefert
# Cross-File-Erkenntnisse wie unused_import. In CI/Hook bewusst weg.
analyzer_rules:
  - unused_declaration

custom_rules:
  no_print:
    name: "print() statt OSLog"
    regex: '(?<![\w\.])print\s*\('
    message: "Verboten: print(). Nutze Log.<category>.<level>(...) aus Core/Observability/Log.swift. Siehe .claude/rules/LOGGING.md."
    severity: warning
    included: ".*\\.swift"
    excluded: ".*Tests\\.swift"

disabled_rules:
  # In SwiftUI ist `body` regelmäßig länger als 50 Lines — zu rauschig.
  - type_body_length
  - file_length
  # Conflict mit SwiftFormat-Convention (wir lassen SwiftFormat führen).
  - opening_brace
  - trailing_comma

# Schwellwerte pragmatisch hochgesetzt — Pre-Release-App mit dichter UI.
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - x
    - y
    - z
    - i
    - n
    # Idiomatische Kurz-Namen, die wir bewusst behalten:
    #  c — Codable `container`
    #  d — JSON-/RowDecoder
    #  t — GRDB `TableDefinition` closure-Parameter
    #  r — `row`/`record` aus PocketBase-API
    #  s — `sample`/`string` in lokalen Helpers
    #  k, v — Header-Dict-Key/Value (URLRequest)
    #  h — `header`
    #  p — `person`
    - c
    - d
    - t
    - r
    - s
    - k
    - v
    - h
    - p

# Force-Unwrap nur in Tests erlauben.
force_unwrapping:
  severity: warning
