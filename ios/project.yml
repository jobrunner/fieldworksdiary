name: Fieldworksdiary
options:
  bundleIdPrefix: app.legulus
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
configs:
  Debug: debug
  # Wie Debug, aber eigene Bundle-ID und die Test-Instanz als Endpoint
  # (docker-compose.test.yml, Port 8092).
  Test: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Phase 14: ties the system tint (NavigationLink chevrons, default
    # Button tints, sheet handles) to the brand green defined in
    # Assets.xcassets/AccentColor.colorset.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
  FliptClient:
    url: https://github.com/flipt-io/flipt-client-swift
    exactVersion: 1.5.5
  FieldworksGeo:
    path: Packages/FieldworksGeo
targets:
  Fieldworksdiary:
    type: application
    platform: iOS
    sources:
      - path: Fieldworksdiary
    dependencies:
      - package: GRDB
        product: GRDB
      - package: FieldworksGeo
      - package: FliptClient
        product: FliptClient
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Fieldworksdiary/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Fieldworksdiary/Fieldworksdiary.entitlements
        DEVELOPMENT_TEAM: XS554Q5YY9
        # ↑ Trage hier deine Apple-Team-ID ein (Xcode →
        # Settings → Accounts → Team-ID), oder lass das Feld
        # leer und wähle das Team in Xcode unter „Signing &
        # Capabilities". Letzteres wird beim nächsten
        # `xcodegen generate` überschrieben — also für
        # dauerhafte Persistenz hier eintragen.
        #
        # Für CLI-Simulator-Builds umgehen wir Signing
        # weiterhin via `xcodebuild ... CODE_SIGN_IDENTITY=""
        # CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO` —
        # die Defaults bleiben hier ON, damit Device-Builds
        # ohne Reibung möglich sind.
        # Default-Werte; pro Config unten überschrieben.
        PRODUCT_BUNDLE_IDENTIFIER: app.legulus.dev
        APP_DISPLAY_NAME: Legulus Dev
        APP_ENV: dev
        TABULARIUS_ENDPOINT_DEFAULT: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.legulus.dev
          APP_DISPLAY_NAME: Legulus Dev
          APP_ENV: dev
          TABULARIUS_ENDPOINT_DEFAULT: https://tabularius.tunnel.legulus.app
          # Der Simulator teilt sich das Netz mit dem Mac und nimmt die
          # lokale Dev-Instanz direkt; den Tunnel braucht nur das Gerät.
          "TABULARIUS_ENDPOINT_DEFAULT[sdk=iphonesimulator*]": http://localhost:8090
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
          # Lockerung der App-Transport-Security: nur Debug-Builds dürfen
          # an rohe IPs über HTTP rauf (z. B. http://192.168.x.x:8090).
          # Staging/Release laufen über HTTPS-Domains und brauchen die
          # Plist nicht.
          INFOPLIST_FILE: Fieldworksdiary/Info.debug.plist
        Test:
          # Eigene Bundle-ID: eigener App-Container im Simulator, die
          # Tests sehen weder Daten noch gespeicherten Endpoint von
          # „Legulus Dev“.
          PRODUCT_BUNDLE_IDENTIFIER: app.legulus.test
          APP_DISPLAY_NAME: Legulus Test
          APP_ENV: dev
          TABULARIUS_ENDPOINT_DEFAULT: http://localhost:8092
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
          # HTTP auf localhost braucht dieselbe ATS-Lockerung wie Debug.
          INFOPLIST_FILE: Fieldworksdiary/Info.debug.plist
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: app.legulus.staging
          APP_DISPLAY_NAME: Legulus Beta
          APP_ENV: staging
          TABULARIUS_ENDPOINT_DEFAULT: https://tabularius-stage.legulus.app
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Staging
          INFOPLIST_FILE: Fieldworksdiary/Info.plist
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.legulus.prod
          APP_DISPLAY_NAME: Legulus
          APP_ENV: production
          TABULARIUS_ENDPOINT_DEFAULT: https://tabularius.legulus.app
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          INFOPLIST_FILE: Fieldworksdiary/Info.plist
  FieldworksdiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FieldworksdiaryTests
        # Snapshot-Referenzen liest SnapshotTesting über den Quellpfad;
        # als Bundle-Ressource bräuchte es sie nicht.
        excludes:
          - "__Snapshots__/**"
    dependencies:
      - target: Fieldworksdiary
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.legulus.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Fieldworksdiary.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Fieldworksdiary
  FieldworksdiaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FieldworksdiaryUITests
    dependencies:
      - target: Fieldworksdiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.legulus.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Fieldworksdiary
schemes:
  Fieldworksdiary:
    # Default-Scheme = Debug (lokal entwickeln, am Simulator laufen).
    # Getestet wird auch hier in der Test-Config, wie im Scheme
    # `Fieldworksdiary-Test`: die UI-Tests brauchen die Test-Instanz
    # und setzen die Sitzung der App neu - das darf „Legulus Dev“
    # nicht treffen.
    build:
      targets:
        Fieldworksdiary: all
        FieldworksdiaryTests: [test]
        FieldworksdiaryUITests: [test]
      config: Debug
    run:
      config: Debug
    test:
      config: Test
      targets:
        - FieldworksdiaryTests
        - FieldworksdiaryUITests
      preActions:
        - name: Test-Instanz von Tabularius neu aufsetzen
          settingsTarget: Fieldworksdiary
          script: |
            "${PROJECT_DIR}/../scripts/reset-test-tabularius.sh"
    archive:
      config: Release
  Fieldworksdiary-Test:
    # Tests gegen die Test-Instanz (docker-compose.test.yml, Port 8092).
    # Die Pre-Action setzt sie vor jedem Testlauf neu auf: leere
    # Datenbank, Migrationen, fester Test-Nutzer. Xcode ignoriert den
    # Exit-Code einer Pre-Action; hart schlägt deshalb
    # `TestTabulariusTests` fehl, wenn die Instanz nicht antwortet.
    build:
      targets:
        Fieldworksdiary: all
        FieldworksdiaryTests: [test]
        FieldworksdiaryUITests: [test]
      config: Test
    run:
      config: Test
    test:
      config: Test
      targets:
        - FieldworksdiaryTests
        - FieldworksdiaryUITests
      preActions:
        - name: Test-Instanz von Tabularius neu aufsetzen
          settingsTarget: Fieldworksdiary
          script: |
            "${PROJECT_DIR}/../scripts/reset-test-tabularius.sh"
    archive:
      config: Test
  Fieldworksdiary-Staging:
    # Für TestFlight-Beta-Builds, CI verwendet dieses Scheme.
    build:
      targets:
        Fieldworksdiary: all
      config: Staging
    run:
      config: Staging
    archive:
      config: Staging
  Fieldworksdiary-Prod:
    # Für App-Store-Submits, CI verwendet dieses Scheme.
    build:
      targets:
        Fieldworksdiary: all
      config: Release
    run:
      config: Release
    archive:
      config: Release
