# Periphery — Swift-Dead-Code-Detection.
# Doku: https://github.com/peripheryapp/periphery
#
# Aufruf:   periphery scan
# Erwartet: ein gebautes Xcode-Projekt unter ios/.

project: ios/Fieldworksdiary.xcodeproj
schemes:
  - Fieldworksdiary
targets:
  - Fieldworksdiary

# SwiftUI- und ObjC-Lifecycle-Methoden, die der Build-System
# über `@main`, `@StateObject` oder das System-Runtime aufruft,
# darf Periphery nicht als „unused" markieren.
retain_public: false
retain_objc_accessible: true
retain_objc_annotated: true
retain_unused_protocol_func_params: false
# Codable-Properties sind Contract-Code (Mirror der Backend- bzw.
# SQLite-Schemata). GRDB liest sie reflektiv beim Persistieren —
# Periphery sieht keinen Swift-Read und meldet sonst false-positives.
# Echtes Dead-Code in Codable-Structs lässt sich notfalls per
# `// periphery:ignore` punktuell prüfen.
retain_codable_properties: true

# SwiftUI-Bodies, Codable-Init-Required-Inits, Previews, AppDelegate-
# Lifecycle: behalten.
retain_swift_ui_previews: true
retain_assign_only_property_types:
  - Optional<UUID>

# Test-Code rausziehen — Tests verweisen oft auf @testable-only Symbole,
# das ist legitim und nicht „unused" im echten Code.
report_exclude:
  - "**/*Tests.swift"
  - "**/__Snapshots__/**"
  - "**/build/**"

# False-Positive-Klassen, die wir bewusst behalten:
retain_files:
  - ios/Fieldworksdiary/Core/Observability/Log.swift   # einzelne Logger werden je nach Feature genutzt
