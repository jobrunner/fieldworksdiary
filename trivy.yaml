# Zentrale Trivy-Defaults. Wird in CI via `trivy-config: trivy.yaml`
# und lokal via `trivy --config trivy.yaml` geladen. Job-spezifische
# Overrides (z. B. exit-code für Prod-Gate) bleiben am Step.

scan:
  # Alle drei nutzbaren Scanner aktiv:
  # - vuln      Vulnerability-DB
  # - misconfig Konfig-Probleme (Dockerfile, K8s, Terraform, …)
  # - secret   Eingebettete Secrets in Binaries und Files
  scanners:
    - vuln
    - misconfig
    - secret

  # Verzeichnisse, die nichts zum Audit beitragen — keine Quellen,
  # keine Manifests, nur Runtime- oder Build-Artefakte.
  skip-dirs:
    - backend/pb_data
    - pb_data_staging
    - pb_data_prod
    - ios/Fieldworksdiary.xcodeproj
    - ios/DerivedData
    - ios/build
    - ios/FieldworksdiaryTests/__Snapshots__
    - dist

# Severity-Filter — gilt für alle Scan-Typen.
# - Advisory-Scans (security.yml): nutzen diesen broader Filter,
#   damit MEDIUM-Severity-Vulns mit realem Impact (z. B. auth-bypass
#   ~ CVSS 6.x) sichtbar bleiben.
# - Der Image-Scan in docker-release.yml nutzt denselben Filter,
#   ebenfalls advisory (SARIF in den Security-Tab).
severity:
  - MEDIUM
  - HIGH
  - CRITICAL

vulnerability:
  # Default-Sichtbarkeit auch für unfixable Vulns (Mitigation-
  # Tracking). Deploy-Gate überschreibt am Step auf `true` — dort
  # wäre Lärm sonst sinnlos blockierend.
  ignore-unfixed: false
