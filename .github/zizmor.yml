# zizmor — GitHub-Actions-Audit-Konfiguration
# Doku: https://docs.zizmor.sh/configuration/
#
# Blanket-Policy `hash-pin`: Jede referenzierte Action MUSS auf einen
# vollen Commit-SHA gepinnt sein, mit Versions-Kommentar
# (`uses: actions/checkout@<sha> # v6.0.2`). Tags sind mutierbar, ein
# kompromittiertes Action-Repo könnte sie umhängen. Dependabot
# (`github-actions`) wertet den Kommentar aus und hebt SHA und
# Kommentar gemeinsam an. Auf Repo-Ebene ist zusätzlich
# „Require actions to be pinned to a full-length commit SHA“ aktiv.

rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
