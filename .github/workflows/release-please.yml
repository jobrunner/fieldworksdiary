# Release automation via release-please.
#
# On every push to main, release-please inspects the Conventional
# Commits since the last release and maintains a "release PR" that:
#   - bumps VERSION + ios/project.yml's MARKETING_VERSION (generic
#     updater, `# x-release-please-version` marker),
#   - cuts CHANGELOG.md ([Unreleased]-style accumulation → a
#     versioned section),
#   - and, when merged, tags vX.Y.Z + creates the GitHub Release.
#
# One version for the whole monorepo (backend + iOS) — see
# release-please-config.json (single "." package, release-type
# "simple"). deploy-prod.yml / deploy-staging.yml read the same
# `VERSION` file at Docker-build time (build-args), so the released
# version always matches what both components report at runtime.
#
# No goreleaser job here — the backend ships as a Docker image (see
# deploy-*.yml), not as a standalone binary release, and iOS ships via
# TestFlight/App Store, not a GitHub Release asset.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release PR, tag, and GitHub Release
      pull-requests: write   # open/maintain the release PR
    steps:
      # Installation token from the same release-please GitHub App used
      # for ortus/tempus/hostus (secrets RELEASE_PLEASE_APP_ID /
      # RELEASE_PLEASE_APP_KEY) — not the default GITHUB_TOKEN. Pushes
      # and PRs made with an app token DO trigger workflows, so the
      # release PR gets its required status checks instead of sitting
      # permanently blocked (GitHub's loop-prevention only exempts the
      # built-in GITHUB_TOKEN). The app needs Contents + Pull requests
      # read/write on this repo, and must be installed on it (Settings →
      # GitHub Apps → Install, or via the app's own settings page).
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
