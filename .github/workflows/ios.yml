name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.swiftlint.yml'
      - '.swiftformat'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.swiftlint.yml'
      - '.swiftformat'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # macOS-Runner sind teuer; PRs auf nicht-iOS-Pfade triggern uns nicht.
    #
    # xcodebuild build/test laufen bewusst NICHT mehr hier — in dieser
    # Entwicklungsphase bauen und testen wir lokal (Simulator + echtes
    # Gerät, siehe CLAUDE.md „Lokales iOS-Testing auf macOS Tahoe").
    # macOS-Runner-Minuten sind teuer genug, dass ein voller
    # build+test-Zyklus pro Push die Credits unnötig auffrisst, solange
    # kein Team parallel darauf angewiesen ist. Bei Bedarf reaktivieren:
    # git log auf diese Datei zeigt die letzte volle Fassung.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install tooling (xcodegen, SwiftLint, SwiftFormat)
        run: |
          brew update
          brew install xcodegen swiftlint swiftformat

      # Periphery ist nur ein Hinweis-Check und darf den Lint nicht
      # blockieren. Der Cask aus peripheryapp/periphery scheitert an
      # `depends_on macos: :catalina` (in Homebrew abgeschaltet), die
      # Core-Formel ist deprecated, weil das Upstream-Repo archiviert ist
      # (Abschaltung 2027-08-12). Danach Schritt entfernen oder ersetzen.
      - name: Install periphery (optional)
        continue-on-error: true
        run: brew install periphery

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint --config .swiftformat ios

      - name: Periphery (warn-only, blockt CI nicht)
        continue-on-error: true
        run: periphery scan --config .periphery.yml --format github-actions

      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

