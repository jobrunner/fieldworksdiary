name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.swiftlint.yml'
      - '.swiftformat'
      - '.github/workflows/ios.yml'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths:
      - 'ios/**'
      - '.swiftlint.yml'
      - '.swiftformat'
      - '.github/workflows/ios.yml'
      - 'flake.nix'
      - 'flake.lock'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # macOS-Runner sind teuer; PRs auf nicht-iOS-Pfade triggern uns nicht.
    #
    # xcodebuild build/test laufen bewusst NICHT mehr hier — in dieser
    # Entwicklungsphase bauen und testen wir lokal (Simulator + echtes
    # Gerät, siehe CLAUDE.md „Lokales iOS-Testing auf macOS Tahoe").
    # macOS-Runner-Minuten sind teuer genug, dass ein voller
    # build+test-Zyklus pro Push die Credits unnötig auffrisst, solange
    # kein Team parallel darauf angewiesen ist. Bei Bedarf reaktivieren:
    # git log auf diese Datei zeigt die letzte volle Fassung.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      # Die Dev-Shell (flake.nix) liest xcode-select; DEVELOPER_DIR als
      # Env würde Nix ohnehin überschreiben.
      - name: Xcode auswählen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version

      # Toolchain kommt wie lokal aus flake.lock (Shell `ios-lint`):
      # swiftformat, swiftlint, xcodegen, periphery in denselben Versionen.
      - uses: cachix/install-nix-action@v31.11.5

      # Nix-Store im Actions-Cache, Schlüssel ist flake.lock. Nach dem
      # ersten Lauf wird nur noch entpackt statt von cache.nixos.org
      # geladen. Der Cache hält vor allem xcodegen: Das liegt nicht im
      # Binary-Cache von nixpkgs und wird sonst bei jedem Lauf samt
      # Swift-Toolchain gebaut (gut 3 Minuten).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-ios-lint-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-ios-lint-v2-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-macos: 2G

      # --profile legt eine GC-Root an. Ohne sie räumt die Garbage
      # Collection vor dem Cache-Speichern die Shell (und das gebaute
      # xcodegen) weg, die Swift-Toolchain fürs Bauen fliegt dagegen raus.
      - name: Dev-Shell bauen
        run: nix develop .#ios-lint --profile "$RUNNER_TEMP/ios-lint-profile" -c true

      - name: Generate Xcode project
        working-directory: ios
        run: nix develop ..#ios-lint -c xcodegen generate

      - name: SwiftFormat (lint mode)
        run: nix develop .#ios-lint -c swiftformat --lint --config .swiftformat ios

      # Periphery ist nur ein Hinweis-Check und darf den Lint nicht
      # blockieren. Upstream ist archiviert; fliegt periphery aus
      # nixpkgs, diesen Schritt und den Eintrag in flake.nix entfernen.
      - name: Periphery (warn-only, blockt CI nicht)
        continue-on-error: true
        run: nix develop .#ios-lint -c periphery scan --config .periphery.yml --format github-actions

      - name: SwiftLint
        run: nix develop .#ios-lint -c swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

