name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: gofumpt (Format-Check)
        run: |
          go install mvdan.cc/gofumpt@latest
          DIFF=$(gofumpt -l . | grep -v '^migrations/' || true)
          if [ -n "$DIFF" ]; then
            echo "::error::gofumpt findet Format-Diff in:"; echo "$DIFF"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage Gate — Kern-Packages > 80 %
        run: |
          for pkg in ./internal/codes ./internal/grouping; do
            COV=$(go test -cover "$pkg" 2>/dev/null | grep -oE 'coverage: [0-9.]+%' | grep -oE '[0-9.]+' || echo "0")
            if awk -v c="$COV" 'BEGIN{exit !(c >= 80)}'; then
              echo "✓ $pkg: ${COV}%"
            else
              echo "::error::$pkg coverage ${COV}% < 80 %"
              exit 1
            fi
          done

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

      - name: go build
        run: go build -v ./...
