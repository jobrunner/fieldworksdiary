name: Docker Release

# Baut das Backend-Image bei jedem Push auf `main` und legt es in der
# GitHub Container Registry ab. Deployt wird manuell (wie bei Ortus):
# auf dem Host `docker compose -f docker-compose.prod.yml pull && up -d`.
# GitHub hat keinen Zugriff auf den Host.
#
# Multi-Arch (amd64 + arm64): Go cross-kompiliert im Builder auf der
# Runner-Architektur, QEMU braucht es nur für den kurzen apk-Schritt
# im Runtime-Image.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ios/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fieldworksdiary

jobs:
  backend-image:
    name: Build & Push Backend-Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # für ghcr.io-Push
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Login zu GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Versionierung wie bei Ortus: `VERSION` (von release-please
      # gepflegt) liefert X.Y.Z, X.Y und X, dazu `latest` und der
      # Short-SHA. Deployt wird eine feste Version (FWD_VERSION in
      # docker-compose.prod.yml). Achtung: Zwischen zwei Releases zeigt
      # X.Y.Z auf den jeweils neuesten main-Stand; unveränderlich ist
      # nur der SHA-Tag. `cut` schneidet den
      # `# x-release-please-version`-Marker ab.
      - name: Version ermitteln
        id: version
        run: |
          VERSION=$(head -n1 VERSION | cut -d' ' -f1)
          {
            echo "value=$VERSION"
            echo "minor=$(echo "$VERSION" | cut -d. -f1-2)"
            echo "major=$(echo "$VERSION" | cut -d. -f1)"
            echo "commit=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Metadaten (Tags + Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build & Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,scope=backend-release,mode=max

  # Advisory-Scan des veröffentlichten Images: blockiert nichts, das
  # SARIF liegt als Artifact am Lauf. Den Security-Tab gibt es nicht,
  # weil Code Scanning bei privaten Repos GitHub Code Security braucht
  # (wie in security.yml).
  image-scan:
    name: Trivy-Scan (advisory)
    runs-on: ubuntu-latest
    needs: backend-image
    permissions:
      contents: read
      packages: read           # privates Image aus ghcr ziehen
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Trivy-Scan
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.backend-image.outputs.digest }}
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-results.sarif

      - name: SARIF als Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-release-image-sarif
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30
