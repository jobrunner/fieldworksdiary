name: Docker Release

# Baut das Backend-Image bei jedem Push auf `main` und legt es in der
# GitHub Container Registry ab. Deployt wird manuell (wie bei Ortus):
# auf dem Host `docker compose -f docker-compose.prod.yml pull && up -d`.
# GitHub hat keinen Zugriff auf den Host.
#
# Multi-Arch (amd64 + arm64): Go cross-kompiliert im Builder auf der
# Runner-Architektur, QEMU braucht es nur für den kurzen apk-Schritt
# im Runtime-Image.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ios/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fieldworksdiary

jobs:
  backend-image:
    name: Build & Push Backend-Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # für ghcr.io-Push
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Login zu GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `prod` bleibt als Tag, weil docker-compose.prod.yml ihn als
      # Default zieht; `sha-…` erlaubt das Zurückrollen auf einen Stand.
      - name: Metadaten (Tags + Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=prod
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # `VERSION` (von release-please gepflegt) + Short-SHA gehen als
      # Build-Args ins Image, damit `/api/version` die echte Version
      # zeigt. `cut` schneidet den `# x-release-please-version`-Marker ab.
      - name: Version-Build-Args ermitteln
        id: version
        run: |
          echo "value=$(cut -d' ' -f1 VERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,scope=backend-release,mode=max

  # Advisory-Scan des veröffentlichten Images wie bei Ortus: Ergebnisse
  # landen im Security-Tab, blockieren aber nichts.
  image-scan:
    name: Trivy-Scan (advisory)
    runs-on: ubuntu-latest
    needs: backend-image
    permissions:
      contents: read
      packages: read           # privates Image aus ghcr ziehen
      security-events: write   # SARIF-Upload
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Trivy-Scan
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.backend-image.outputs.digest }}
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-results.sarif

      - name: SARIF hochladen
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
