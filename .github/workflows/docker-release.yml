name: Docker Release

# Baut das Backend-Image bei jedem Push auf `main` und legt es in der
# GitHub Container Registry ab. Deployt wird manuell (wie bei Ortus):
# auf dem Host `docker compose -f docker-compose.prod.yml pull && up -d`.
# GitHub hat keinen Zugriff auf den Host.
#
# Tags:
# - Jeder main-Build: Short-SHA (unveränderlich) und `edge` (wandert
#   bewusst mit, für „neuester Stand“).
# - Release (Git-Tag vX.Y.Z, von release-please angelegt): Der Job
#   `promote` hängt X.Y.Z, X.Y, X und `latest` an das bereits gebaute
#   Image des Release-Commits. Es wird nicht neu gebaut, der Digest und
#   damit die Attestation (source-ref refs/heads/main) bleiben gleich.
#
# Multi-Arch (amd64 + arm64): Go cross-kompiliert im Builder auf der
# Runner-Architektur, QEMU braucht es nur für den kurzen apk-Schritt
# im Runtime-Image.

on:
  push:
    branches: [main]
    # Pfadfilter gelten nur für Branch-Pushes, Tag-Pushes laufen immer.
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ios/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fieldworksdiary

jobs:
  backend-image:
    name: Build & Push Backend-Image
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release-build
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write     # für ghcr.io-Push
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login zu GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version fürs Binary und das OCI-Label: Ändert der Commit die
      # `VERSION`-Datei, ist es der Release-Commit und bekommt X.Y.Z.
      # Sonst X.Y.Z+g<sha>, also „nach X.Y.Z, Stand <sha>“. `cut`
      # schneidet den `# x-release-please-version`-Marker ab.
      - name: Version ermitteln
        id: version
        run: |
          BASE=$(head -n1 VERSION | cut -d' ' -f1)
          COMMIT=${GITHUB_SHA::7}
          if git diff --quiet HEAD^1 HEAD -- VERSION; then
            VERSION="${BASE}+g${COMMIT}"
          else
            VERSION="${BASE}"
          fi
          {
            echo "value=$VERSION"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Metadaten (Tags + Labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=edge
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build & Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,scope=backend-release,mode=max
          # BuildKit hängt SLSA-Provenance und ein SPDX-SBOM als
          # Attestation-Manifeste an den Image-Index. In GHCR tauchen
          # die als Plattform `unknown/unknown` auf, das ist normal.
          provenance: mode=max
          sbom: true

  # Signierte Build-Provenance (Sigstore) auf den Digest. Eigener Job,
  # damit ein Fehler hier den Image-Scan nicht überspringt; der hängt
  # nur am Push. Prüfen mit:
  #   gh attestation verify oci://ghcr.io/jobrunner/fieldworksdiary:<tag> \
  #     -R jobrunner/fieldworksdiary
  attest:
    name: Build-Provenance attestieren
    runs-on: ubuntu-latest
    needs: backend-image
    permissions:
      packages: write     # Attestation nach ghcr.io pushen
      id-token: write     # OIDC-Token für die Sigstore-Signatur
      attestations: write # Build-Provenance im Repo ablegen
    steps:
      - name: Login zu GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build-Provenance attestieren
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.backend-image.outputs.digest }}
          push-to-registry: true

  # Advisory-Scan des veröffentlichten Images: blockiert nichts, das
  # SARIF geht in den Security-Tab (wie in security.yml).
  image-scan:
    name: Trivy-Scan (advisory)
    runs-on: ubuntu-latest
    needs: backend-image
    permissions:
      contents: read
      packages: read           # Image aus ghcr ziehen
      security-events: write   # SARIF-Upload
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Trivy-Scan
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.backend-image.outputs.digest }}
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-results.sarif

      - name: SARIF in den Security-Tab hochladen
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release-image

  # Release: Versions-Tags an das Image des Release-Commits hängen. Das
  # Manifest wird byte-genau unter den neuen Tags abgelegt, deshalb
  # bleibt der Digest identisch (am Ende geprüft). Der main-Build des
  # Release-Commits läuft parallel an; ist sein Image noch nicht da,
  # wird bis zu 15 Minuten gewartet.
  promote:
    name: Release-Tags setzen
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release-promote-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write     # Tags in ghcr.io setzen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Version prüfen
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG hat nicht die Form vX.Y.Z"; exit 1
          fi
          VERSION="${TAG#v}"
          FILE=$(head -n1 VERSION | cut -d' ' -f1)
          if [[ "$FILE" != "$VERSION" ]]; then
            echo "::error::VERSION-Datei ($FILE) passt nicht zum Tag ($TAG)"; exit 1
          fi
          {
            echo "value=$VERSION"
            echo "minor=$(echo "$VERSION" | cut -d. -f1-2)"
            echo "major=$(echo "$VERSION" | cut -d. -f1)"
            echo "commit=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Image des Release-Commits befördern
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          REPO="${IMAGE#ghcr.io/}"
          REG="https://ghcr.io/v2/${REPO}/manifests"
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
          token() {
            curl -fsS -u "${ACTOR}:${GH_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull,push" | jq -r .token
          }

          for i in $(seq 1 30); do
            TOKEN=$(token)
            if curl -fsS -o manifest.json -D headers.txt \
                -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" "${REG}/${COMMIT}"; then
              break
            fi
            if [[ $i == 30 ]]; then
              echo "::error::${IMAGE}:${COMMIT} nicht gefunden. Lief der main-Build für diesen Commit?"; exit 1
            fi
            echo "warte auf ${IMAGE}:${COMMIT} (${i}/30)..."
            sleep 30
          done

          CT=$(grep -i '^content-type:' headers.txt | tail -1 | cut -d' ' -f2- | tr -d '\r')
          DIGEST=$(grep -i '^docker-content-digest:' headers.txt | tail -1 | cut -d' ' -f2 | tr -d '\r')
          echo "Quelle: ${IMAGE}:${COMMIT} (${DIGEST})"

          for tag in "${VERSION}" "${MINOR}" "${MAJOR}" latest; do
            curl -fsS -X PUT -o /dev/null -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: ${CT}" --data-binary @manifest.json "${REG}/${tag}"
            GOT=$(curl -fsSI -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" "${REG}/${tag}" \
              | grep -i '^docker-content-digest:' | cut -d' ' -f2 | tr -d '\r')
            if [[ "$GOT" != "$DIGEST" ]]; then
              echo "::error::${tag} zeigt auf ${GOT}, erwartet ${DIGEST}"; exit 1
            fi
            echo "${IMAGE}:${tag} -> ${DIGEST}"
          done

          {
            echo "### ${IMAGE}:${VERSION}"
            echo
            echo "Befördert von \`${COMMIT}\`, Digest \`${DIGEST}\`."
            echo "Tags: \`${VERSION}\`, \`${MINOR}\`, \`${MAJOR}\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
