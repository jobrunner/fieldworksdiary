# Test-Instanz von Tabularius für die iOS-Tests (Scheme
# `Legulus-Test`, App „Legulus Test“).
#
# Eigenständig, kein Overlay:
#   docker compose -f docker-compose.test.yml up -d --build
#
# Läuft neben der Dev-Instanz (docker-compose.yml): eigener
# Projektname, eigener Container, Port 8092, eigenes Datenverzeichnis.
# `scripts/reset-test-tabularius.sh` setzt sie vor jedem Testlauf neu
# auf (leeres `tabularius/pb_data_test`, Migrationen, Test-Nutzer).

name: legulus-test

services:
  tabularius:
    build: ./tabularius
    container_name: tabularius-test
    ports:
      # Nur Loopback: Simulator und Tests laufen auf diesem Rechner, und
      # die Zugangsdaten des Test-Nutzers stehen im Repo.
      - "127.0.0.1:8092:8090"
    volumes:
      - ./tabularius/pb_data_test:/app/pb_data
    environment:
      APP_ENV: test
      APPLE_ALLOWED_AUDIENCES: app.legulus.test
      ORTUS_BASE_URL: ${ORTUS_BASE_URL:-https://ortus.legulus.app}
      # Leer: die Test-Instanz fragt Tempus nicht ab, damit die iOS-Tests
      # nicht vom Netz abhängen.
      TEMPUS_BASE_URL: ${TEMPUS_BASE_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
