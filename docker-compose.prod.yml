# Overlay für die Production-Umgebung.
# Aufruf:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# Erwartet, dass das Image bereits in der Registry liegt (CI baut bei
# jedem Push auf main, ein Release setzt X.Y.Z). Die Version kommt aus
# TABULARIUS_VERSION (z.B. in der .env neben dieser Datei: `TABULARIUS_VERSION=0.1.0`).
# Ohne gesetzte Version bricht compose ab, damit nie still ein falsches
# Image läuft.

name: legulus-prod

services:
  tabularius:
    image: ghcr.io/jobrunner/tabularius:${TABULARIUS_VERSION:?TABULARIUS_VERSION setzen, z.B. 0.1.0}
    container_name: tabularius-prod
    ports: !override
      - "8090:8090"
    volumes: !override
      - ./pb_data_prod:/app/pb_data
    environment:
      APP_ENV: production
      ORTUS_BASE_URL: ${ORTUS_BASE_URL:-https://ortus.legulus.app}
    labels:
      env: production
      managed-by: docker-compose
