# git-cliff config — generiert CHANGELOG.md aus Conventional Commits.
# Voll-Generierung:   git-cliff -o CHANGELOG.md
# Seit letztem Tag:   git-cliff --latest -p CHANGELOG.md --prepend
# Nächster Release:   git-cliff --unreleased --tag v0.2.0 -o CHANGELOG.md

[changelog]
header = """
# Changelog

Alle erwähnenswerten Änderungen werden hier dokumentiert.\n
Format orientiert sich an [Keep a Changelog](https://keepachangelog.com/),\n
Versionierung folgt [Semantic Versioning](https://semver.org/).\n\n
"""

body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING** {% endif %}\
          {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
          {{ commit.message | upper_first }}\
          {% if commit.remote.username %} (@{{ commit.remote.username }}){% endif %}\
    {% endfor %}
{% endfor %}\n
"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false   # Tools-/Initial-Commits nicht verlieren
require_conventional = false    # nur warnen, nicht abbrechen
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat",     group = "🚀 Features" },
  { message = "^fix",      group = "🐛 Fixes" },
  { message = "^perf",     group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs",     group = "📚 Docs" },
  { message = "^test",     group = "🧪 Tests" },
  { message = "^build",    group = "📦 Build" },
  { message = "^ci",       group = "🤖 CI" },
  { message = "^style",    group = "🎨 Style" },
  { message = "^chore",    group = "🔧 Chore" },
  { message = "^revert",   group = "⏪ Revert" },
  { message = ".*",        group = "Misc" },
]

commit_preprocessors = [
  # Issue-Refs in GitHub-Links umwandeln.
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://gitlab.com/fieldworksdiary/fieldworksdiary-ng/issues/${1}))" },
]
