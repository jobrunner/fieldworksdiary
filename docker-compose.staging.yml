# Overlay für die Staging-Umgebung.
# Aufruf:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --no-build
#
# Voraussetzung: das Image `${TABULARIUS_IMAGE:-ghcr.io/jobrunner/tabularius:staging}`
# liegt in der Registry — CI baut + pusht es nach jedem Push auf den
# staging-Branch.

name: legulus-staging

services:
  tabularius:
    image: ${TABULARIUS_IMAGE:-ghcr.io/jobrunner/tabularius:staging}
    container_name: tabularius-staging
    ports: !override
      - "8091:8090"
    volumes: !override
      - ./pb_data_staging:/app/pb_data
    environment:
      APP_ENV: staging
      ORTUS_BASE_URL: ${ORTUS_BASE_URL:-https://ortus.legulus.app}
    labels:
      env: staging
      managed-by: docker-compose
