# Overlay für die Staging-Umgebung.
# Aufruf:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --no-build
#
# Voraussetzung: das Image `${BACKEND_IMAGE:-ghcr.io/jobrunner/fieldworksdiary:staging}`
# liegt in der Registry — CI baut + pusht es nach jedem Push auf den
# staging-Branch.

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/jobrunner/fieldworksdiary:staging}
    container_name: fieldworksdiary-backend-staging
    ports: !override
      - "8091:8090"
    volumes: !override
      - ./pb_data_staging:/app/pb_data
    environment:
      APP_ENV: staging
      ORTUS_BASE_URL: ${ORTUS_BASE_URL:-https://ortus.fieldworksdiary.org}
    labels:
      env: staging
      managed-by: docker-compose
